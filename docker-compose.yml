services:

  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_URL=postgresql://postgres:postgres@db/contact_db

  db:
    image: postgres
    volumes:
       - ./postgres-data:/var/lib/postgresql
    environment:
       - POSTGRES_USER=postgres
       - POSTGRES_PASSWORD=postgres
       - POSTGRES_DB=contact_db