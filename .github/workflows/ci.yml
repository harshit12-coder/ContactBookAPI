steps:
  - name: Checkout code
    uses: actions/checkout@v3

  - name: Setup Python
    uses: actions/setup-python@v4
    with:
      python-version: "3.10"

  - name: Install dependencies
    run: pip install -r requirements.txt

  - name: Run migrations        # ← YEH ADD KARO
    env:
      DB_URL: postgresql://postgres:postgres@localhost:5432/contact_test_db
    run: alembic upgrade head

  - name: Run tests
    env:
      DB_URL: postgresql://postgres:postgres@localhost:5432/contact_test_db
    run: pytest -v